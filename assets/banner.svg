<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0C0E"/>
      <stop offset="0.55" stop-color="#141418"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.45" r="0.52">
      <stop offset="0" stop-color="#F2B544" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2B544" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F4F6"/>
      <stop offset="1" stop-color="#A6ACB8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCE6B"/>
      <stop offset="1" stop-color="#E9A62F"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#glow)"/>

  <!-- faint rack lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="120" x2="1600" y2="120"/>
    <line x1="0" y1="240" x2="1600" y2="240"/>
    <line x1="0" y1="360" x2="1600" y2="360"/>
  </g>

  <!-- mark: the map view's machine node, ports tapped along the panel edges -->
  <g transform="translate(150 240)">
    <rect x="-104" y="-104" width="208" height="208" rx="36" fill="#17171B" stroke="url(#silver)" stroke-width="7"/>
    <rect x="-58" y="-66" width="116" height="82" rx="12" fill="none" stroke="url(#amber)" stroke-width="11"/>
    <path d="M0,22 v22" stroke="#F2B544" stroke-width="11" stroke-linecap="round"/>
    <path d="M-32,50 h64" stroke="#F2B544" stroke-width="11" stroke-linecap="round"/>
    <circle cx="44" cy="-52" r="9" fill="#3FB950"/>
    <g fill="#F2B544">
      <circle cx="-104" cy="-46" r="9"/>
      <circle cx="-104" cy="0" r="9"/>
      <circle cx="-104" cy="46" r="9"/>
      <circle cx="104" cy="-46" r="9"/>
      <circle cx="104" cy="0" r="9"/>
      <circle cx="104" cy="46" r="9"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="322" y="212" font-family="Montserrat" font-weight="700"
        font-size="132" letter-spacing="4" fill="url(#silver)">PORT</text>
  <text x="322" y="330" font-family="Montserrat" font-weight="700"
        font-size="132" letter-spacing="4" fill="#F2B544">BOOK</text>

  <!-- accent rule -->
  <rect x="326" y="366" width="300" height="5" rx="2.5" fill="#F2B544"/>

  <!-- subtitle -->
  <text x="326" y="418" font-family="Montserrat" font-weight="500"
        font-size="34" letter-spacing="2" fill="#8B8F96">one Python file, no server, no login</text>

  <!-- the four views, as a tab strip -->
  <g font-family="Montserrat" font-weight="600" font-size="26" fill="#5A5E66" letter-spacing="3">
    <text x="1200" y="150">MACHINES</text>
    <text x="1200" y="205">MAP</text>
    <text x="1200" y="260">TICKETS</text>
    <text x="1200" y="315">PORTS</text>
  </g>
  <g stroke="#F2B544" stroke-width="3">
    <line x1="1170" y1="142" x2="1170" y2="150"/>
    <line x1="1170" y1="197" x2="1170" y2="205"/>
  </g>
</svg>
