name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check and CLI smoke test
        run: |
          python3 -m py_compile portbook.py
          python3 portbook.py --help
      - name: Validate build script syntax
        run: bash -n build/rebuild.sh
